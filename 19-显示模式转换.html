<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示模式</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            display: inline;
        }

        .div1 {
            background-color: brown;
        }

        .div2 {
            background-color: orange;
        }

        span {
            width: 200px;
            height: 200px;
            display: block;
        }

        .span1 {
            background-color: brown;
        }

        .span2 {
            background-color: orange;
        }
        img {
            width: 100px;
            height: 100px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="div1">div 标签1</div>
    <div class="div2">div 标签2</div>

    <span class="span1">span1111111</span>
    <span class="span2">span1</span>

    <img src="../images/11.gif" alt="">
    <img src="../images/11.gif" alt="">
</body>
</html>
