    <p>2015年，进入国家二队。2017年，升入一队 ；6月， 首次在日本公开赛中斩获女单、女双冠军  ；7月，世界排名从无直接“空降”至世界第10 ；同年获2017年世青赛女单、女双、女团三冠 。2019年，获世锦赛女双冠军、世界杯女团冠军，首次获亚锦赛与全锦赛女单冠军 。2020年，获WTT澳门国际乒乓球女单冠军，是WTT历史上首位冠军 。2021年，获东京奥运会乒乓球女单亚军、女团冠军；11月，世乒赛女单亚军、女双冠军、混双冠军。 12月，2021年WTT世界杯女单冠军 。2022年，首次登顶世界第一， 成为世界乒坛首位“00后”世界第一。</p>
