<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类选择器</title>
    <style>
        .blue {
            color: blue;
        }

        .size {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <p class="blue">2222</p>
    <p>2222</p>
    <div class="blue size">77777</div>
</body>
</html>
